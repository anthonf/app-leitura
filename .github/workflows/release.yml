name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK Generated
        run: |
          echo "Verificando se o APK foi gerado..."
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VersoLivros-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-test"
          name: "VersoLivros v1.0 - APK para Testes"
          body: |
            ### 📥 Download do APK VersoLivros
            Baixe o arquivo **app-debug.apk** abaixo para testar diretamente no seu dispositivo Android.
            
            #### Recursos incluídos nesta versão:
            - **Upload de Capítulos**: Importação de arquivos `.txt` e `.md` diretamente do armazenamento.
            - **Múltiplas Categorias**: Suporte a múltiplos gêneros e adição de tags personalizadas.
            - **Busca em Tempo Real**: Pesquisa ágil por título, autor e categorias.
            - **Leitor com Conforto Visual**: Modo Noturno (Dark), Sépia, Claro e OLED, com controle de fontes e tamanhos.
            - **Comentários & Feedback**: Comentários por capítulo e avaliações beta com termômetro da comunidade.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
